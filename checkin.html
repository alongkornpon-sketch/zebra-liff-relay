<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Check In / Out</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1B2F5E; font-family: sans-serif; color: #fff; }
    .wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .spinner { width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .msg { margin-top: 16px; font-size: 13px; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="msg">กำลังเปิดหน้า Check In / Out...</div>
  </div>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzJrkPqHEeCDuORXnSkjF9GTbjJeJXkTZy97C1qUrcxED1xDgkUo0lif0fNu8CkeXvJ/exec';

    // true  = ฝัง CheckInForm ใน iframe (ไม่แสดงแถบ Google Apps Script)
    // false = redirect ไป GAS ตรงๆ แบบเดิม — ใช้ย้อนกลับทันทีถ้า GPS ใน iframe มีปัญหา
    const USE_IFRAME = false;
    const IFRAME_TIMEOUT_MS = 15000;

    const userId = new URLSearchParams(location.search).get('userId') || '';
    const url = GAS_URL + '?page=checkin&userId=' + encodeURIComponent(userId);

    if (!USE_IFRAME) {
      window.location.replace(url);
    } else {
      const frame = document.createElement('iframe');
      frame.src = url;
      frame.allow = 'geolocation; fullscreen';
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fff;opacity:0';
      const fallback = setTimeout(() => window.location.replace(url), IFRAME_TIMEOUT_MS);
      frame.addEventListener('load', () => { clearTimeout(fallback); frame.style.opacity = '1'; });
      document.body.appendChild(frame);
    }
  </script>
</body>
</html>
