<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zebra HR Hub</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1B2F5E;
      font-family: sans-serif;
      color: #fff;
    }
    .logo { font-size: 48px; margin-bottom: 12px; }
    .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .sub { font-size: 14px; opacity: 0.7; margin-bottom: 32px; }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .msg { margin-top: 16px; font-size: 13px; opacity: 0.8; }
    .err { color: #ff8a8a; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">🦓</div>
  <div class="title">Zebra HR Hub</div>
  <div class="sub">บริษัท เสถียรสเตนเลสสตีล จำกัด (มหาชน)</div>
  <div class="spinner" id="spinner"></div>
  <div class="msg" id="msg">กำลังเข้าสู่ระบบ...</div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID  = '2010519606-94iBtRRW';
    const GAS_URL  = 'https://script.google.com/macros/s/AKfycbzJrkPqHEeCDuORXnSkjF9GTbjJeJXkTZy97C1qUrcxED1xDgkUo0lif0fNu8CkeXvJ/exec';

    // true  = ฝัง GAS ใน iframe เต็มจอ (ไม่แสดงแถบ "สร้างโดยผู้ใช้ Google Apps Script")
    // false = redirect ไป GAS ตรงๆ แบบเดิม — ใช้ย้อนกลับทันทีถ้า iframe มีปัญหา
    const USE_IFRAME = true;
    const IFRAME_TIMEOUT_MS = 15000;

    function showError(text) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').textContent = text;
      document.getElementById('msg').classList.add('err');
    }

    function openGas(url) {
      if (!USE_IFRAME) { window.location.replace(url); return; }
      const frame = document.createElement('iframe');
      frame.src = url;
      frame.allow = 'geolocation; fullscreen; clipboard-write';
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fff;opacity:0';
      // ถ้า iframe ไม่โหลดภายในเวลาที่กำหนด ถอยไป redirect แบบเดิมอัตโนมัติ
      const fallback = setTimeout(() => window.location.replace(url), IFRAME_TIMEOUT_MS);
      frame.addEventListener('load', () => {
        clearTimeout(fallback);
        frame.style.opacity = '1';
      });
      document.body.appendChild(frame);
    }

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: location.href });
          return;
        }
        document.getElementById('msg').textContent = 'กำลังโหลดข้อมูล...';
        return liff.getProfile();
      })
      .then(profile => {
        if (!profile) return;
        const url = GAS_URL + '?userId=' + encodeURIComponent(profile.userId);
        openGas(url);
      })
      .catch(err => {
        showError('เกิดข้อผิดพลาด: ' + err.message);
      });
  </script>
</body>
</html>
